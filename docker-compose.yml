services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mapa
      POSTGRES_PASSWORD: mapa_dev
      POSTGRES_DB: mapa
    ports:
      - "5433:5432"
    volumes:
      - mapa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapa"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  mapa_pg:
